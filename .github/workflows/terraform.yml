name: Terraform

on:
  push:
    branches-ignore: [main]
    paths: ["terraform/**"]
  pull_request:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  lint:
    name: Fmt / Validate / tfsec
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform

  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: dflook/terraform-plan@v1
        with:
          path: terraform
          backend_config: |
            resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}
            storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_ssh_allowed_ip: ${{ secrets.SSH_ALLOWED_IP }}
          TF_VAR_admin_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

  apply:
    name: Plan / Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_ssh_allowed_ip: ${{ secrets.SSH_ALLOWED_IP }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"

      - name: Terraform plan
        working-directory: terraform
        run: |
          set -o pipefail
          terraform plan -out=tfplan -input=false 2>&1 | tee plan_output.txt
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
