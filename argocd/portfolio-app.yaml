apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: portfolio=petropolishchuk2211/portfolio
    argocd-image-updater.argoproj.io/portfolio.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/github-creds
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  sources:
    - repoURL: https://github.com/wexire/homelab
      targetRevision: feat/initial-setup
      path: charts/microservice
      helm:
        releaseName: portfolio
        valueFiles:
          - $homelab/k8s/portfolio/values.yaml
        parameters:
          - name: commitSha
            value: $ARGOCD_APP_REVISION
    - repoURL: https://github.com/wexire/homelab
      targetRevision: feat/initial-setup
      ref: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
